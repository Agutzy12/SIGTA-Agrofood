<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SIGTA · Sistema Integral de Gestión y Trazabilidad Alimentaria" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>SIGTA · Gestión y Trazabilidad Alimentaria</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Aplicación instalable (PWA): en el celular o la PC se puede "Instalar" y abre como una app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SIGTA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="/fonts/SourceSans3-Regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/SourceSans3-SemiBold.woff" as="font" type="font/woff" crossorigin />
    <!-- El tema se fija antes de dibujar: la carga nunca muestra un fondo del color equivocado -->
    <script>try{if(localStorage.getItem("sigta_tema")==="oscuro")document.documentElement.dataset.tema="oscuro"}catch(e){}</script>
    <style>html{background:#f5f5f2}html[data-tema=oscuro]{background:#0d0d0e;color-scheme:dark}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
